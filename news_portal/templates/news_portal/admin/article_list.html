<h1>Статьи</h1>
<a href="{% url 'admin_article_create' %}">Создать статью</a>
<ul>
  {% for a in articles %}
    <li>
      {{ a.title }}
      <a href="{% url 'admin_article_edit' a.pk %}">Редактировать</a>
      <form method="post" action="{% url 'admin_article_delete' a.pk %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Удалить</button>
      </form>
    </li>
  {% endfor %}
</ul>
