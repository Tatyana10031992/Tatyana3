<!DOCTYPE html>
<html>
<head>
    <title>{{ film.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        h1 {
            color: #ffd700;
            font-size: 2.5em;
            text-align: center;
        }
        .info {
            background: rgba(255, 215, 0, 0.05);
            padding: 30px;
            border-radius: 12px;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .info p {
            margin: 12px 0;
            line-height: 1.6;
        }
        .info strong {
            color: #ffd700;
        }
        .crawl {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-style: italic;
            line-height: 1.8;
            color: #ccc;
        }
        .back {
            display: block;
            text-align: center;
            color: #ffd700;
            text-decoration: none;
            margin-top: 30px;
            font-size: 18px;
        }
        .back:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>{{ film.title }}</h1>
    <div class="info">
        <p><strong>Эпизод:</strong> {{ film.episode_id }}</p>
        <p><strong>Режиссер:</strong> {{ film.director }}</p>
        <p><strong>Продюсеры:</strong> {{ film.producer }}</p>
        <p><strong>Дата выхода:</strong> {{ film.release_date }}</p>
        <div class="crawl">
            <strong>📜 Описание:</strong><br>
            {{ film.opening_crawl|linebreaks }}
        </div>
    </div>
    <a href="{% url 'starwars_app:films_list' %}" class="back">← Назад к фильмам</a>
</body>
</html>
