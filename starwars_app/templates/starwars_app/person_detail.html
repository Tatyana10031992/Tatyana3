<!DOCTYPE html>
<html>
<head>
    <title>{{ person.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        h1 {
            color: #ffd700;
            font-size: 2.5em;
            text-align: center;
        }
        .info {
            background: rgba(255, 215, 0, 0.05);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .info p {
            margin: 12px 0;
            line-height: 1.6;
        }
        .info strong {
            color: #ffd700;
        }
        .back {
            display: block;
            text-align: center;
            color: #ffd700;
            text-decoration: none;
            margin-top: 30px;
            font-size: 18px;
        }
        .back:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>{{ person.name }}</h1>
    <div class="info">
        <p><strong>Рост:</strong> {{ person.height }} см</p>
        <p><strong>Вес:</strong> {{ person.mass }} кг</p>
        <p><strong>Цвет волос:</strong> {{ person.hair_color }}</p>
        <p><strong>Цвет кожи:</strong> {{ person.skin_color }}</p>
        <p><strong>Цвет глаз:</strong> {{ person.eye_color }}</p>
        <p><strong>Год рождения:</strong> {{ person.birth_year }}</p>
        <p><strong>Пол:</strong> {{ person.gender }}</p>
    </div>
    <a href="{% url 'starwars_app:people_list' %}" class="back">← Назад к персонажам</a>
</body>
</html>
