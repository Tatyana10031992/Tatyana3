<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .features ul { list-style: none; padding-left: 0; }
        .features li { margin: 4px 0; color: #444; }
        .price { font-weight: bold; color: #2c3e50; font-size: 1.2rem; }
    </style>
</head>
<body>
    <a href="{% url 'home' %}">← Назад к поиску</a>
    <hr>

    <h1>{{ name }}</h1>
    <p><strong>Бренд:</strong> {{ brand }}</p>
    <p><strong>Тип:</strong> {{ type }}</p>

   
    <h2>Особенности</h2>
    <div class="features">
        <ul>
            {% for feature in features %}
                <li>✅ {{ feature }}</li>
            {% endfor %}
        </ul>
    </div>

    <p class="price">Цена: {{ price }}</p>
</body>
</html>
